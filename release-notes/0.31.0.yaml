version: 0.31.0
date: 2026-11-01
locales:
  en:
    summary: Adds package-root runSelectedArtifactCheck({root, artifacts}) and
      selected-artifacts sub-action under existing check. Validates selected files using
      adopted self-contained JSON Schema and trusted SHA256, with results tied to input,
      origin receipt, and closure. Structure and byte checks are independent; findings and
      partial results may coexist. Returns existing professional-conclusion, interpreted by
      reader as local outcomes.
    changes:
      changed:
        - Introduces runSelectedArtifactCheck({root, artifacts}) at package root and
          selected-artifacts under check. Performs real validation on selected files using
          adopted schema and trusted SHA256.
    upgradeNotes: All four units must upgrade to exactly 0.31.0. Only reads; no tree scanning,
      target execution, network access, or file writes. Supports draft-07 and 2020-12
      synchronous object schemas. Unsupported inputs, known read failures, $id cache
      mismatches, and resource drift are recorded as deficiencies. The caller retains
      responsibility for schema adoption, baseline trust, version and file facts, platform
      semantics, and artifact set integrity. baseline.version is only a label; version
      constraints are expressed via const/enum in the adopted schema. Local
      ENGINEERING_CLEAR does not imply complete engineering review, host
      installation/update/enable, or business operation success.
  zh-CN:
    summary: 新增包根 runSelectedArtifactCheck({root, artifacts}) 及既有 check 下的 selected-artifacts
      子动作。对所选文件执行已采用自包含JSON Schema与可信SHA256的真实校验，结果绑定输入、实际来源回执与闭包。结构与字节检查独立，发现与部分结果可并存。返回现有
      professional-conclusion，由 reader 解释局部结果。
    changes:
      changed:
        - 包根新增 runSelectedArtifactCheck({root, artifacts})，check 下新增 selected-artifacts
          子动作。对所选文件执行已采用Schema与可信SHA256的真实校验。
    upgradeNotes: 四单元必须精确升级至0.31.0。仅读取，不扫描整树、不执行目标、不联网、不写文件。支持现有 draft-07/2020-12
      同步对象Schema。不支持输入、已知读取失败、$id缓存差异及资源漂移均如实记为不足。调用方仍负责Schema实际采用、基准信任、版本与文件事实、平台语义及选集完整性。baseline.version
      仅为标签，内容版本约束由已采用Schema的 const/enum 表达。局部 ENGINEERING_CLEAR 不代表完整工程审阅、宿主安装/更新/启用或业务运行成功。
