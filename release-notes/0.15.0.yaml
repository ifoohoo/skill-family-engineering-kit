    summary: Engineering Kit 0.15.0 增加固定的 native-lifecycle 与 Kimi 目录资格入口。
    changes:
      added:
        - 增加 Qoder 与 WorkBuddy 封闭十二阶段生命周期 fixture 解析。
        - 增加 Kimi 目录资格检查，使用 driverVersion 1.0.0 与 CLI 0.39.1 接纳规则。
