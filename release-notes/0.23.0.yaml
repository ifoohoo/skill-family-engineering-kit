version: 0.23.0
date: 2026-09-26
locales:
  en:
    summary: Engineering Kit 0.23.0 keeps the four top-level commands and adds family proof creation and proof reading for a complete static professional review. This note records the local lockstep candidate only; it does not claim remote publication or real-host acceptance.
    changes:
      added:
        - Adds `check proof-create`, which projects one caller-supplied static review result into a single exclusive Foundation conclusion. It checks the review structure and writes the family result; it does not scan the target again, authenticate authorship, or overwrite an existing conclusion.
        - Adds `check proof`, which reads one existing Foundation-family proof and explains its public code. It does not scan the target, follow paths inside `details`, or authenticate authorship.
        - Records `FOUNDATION_STATIC_CLEAR` only when every applicable selected static item passes, `FOUNDATION_STATIC_FINDINGS` when a real finding is present, and `FOUNDATION_STATIC_INCOMPLETE` when coverage is unfinished, evidence is insufficient, or every selected item is not applicable. Existing `ENGINEERING_*` codes stay limited to the previous declaration branches.
      changed:
        - Moves the package coordinate to 0.23.0 together with Contracts, Harness, and the adoption Plugin. The Contracts specification remains 1.20.0, and this package adds no new contract object or Harness mechanism.
    upgradeNotes: Pin all three Foundation packages to exactly 0.23.0. The Kit projects and reads the family result; the engineering judgment stays with `foundation-engineering-check`. Remote publication and real-host verification are outside this note.
  zh-CN:
    summary: Engineering Kit 0.23.0 保持四个顶层命令，并增加完整静态专业审阅所需的本族证明出证和读取。本说明只记录本地锁步候选，不表示已经远端发布，也不表示真实宿主已经接受。
    changes:
      added:
        - 增加 `check proof-create`。它把调用方提供的一份静态审阅结果投影成一份排他的 Foundation 结论，只检查审阅结构并写入本族结果；不再次扫描目标，不鉴定作者，也不覆盖已有结论。
        - 增加 `check proof`。它读取一份已有的本族证明并解释公开领域码；不扫描目标，不追随 `details` 里的路径，不鉴定作者。
        - 全部适用且选中的静态项通过时记录 `FOUNDATION_STATIC_CLEAR`；存在真实发现时记录 `FOUNDATION_STATIC_FINDINGS`；覆盖未完成、证据不足，或选中项全部不适用时记录 `FOUNDATION_STATIC_INCOMPLETE`。既有 `ENGINEERING_*` 仍只表示原来的局部声明检查。
      changed:
        - 包坐标与 Contracts、Harness 和采用 Plugin 一起前移到 0.23.0。Contracts 规格仍是 1.20.0。本包不新增合同对象，也不新增 Harness 机制。
    upgradeNotes: 三个 Foundation 包须一起精确锁定到 0.23.0。Kit 负责投影和读取本族结果；工程判断仍由 `foundation-engineering-check` 作出。远端发布和真实宿主验证不在本说明范围内。
