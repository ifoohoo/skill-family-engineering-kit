version: 0.36.0
date: 2026-11-03
locales:
  en:
    summary: "Kit introduces the root-level API `runPeerAdapterCheck({root, request, peerRoots})` in version 0.36.0, reusing existing peer requests and actual directory verification without a new CLI. The API fixes the first peer as the anchor and performs N−1 real two-peer calls on the remaining peers, binding before/after filesystem observations and returning the existing `professional-conclusion`. Full health is `complete/ENGINEERING_CLEAR`, an attributable `closure-conflict` from the same actual call is classified as `finding`, mixed unmet conditions as `partial`, and no valid completed pair as `not-performed`, even when failed calls were attempted. Invalid global parameters raise SFC2003, unknown exceptions are thrown directly, and drift causing a pair to become invalid results in its removal from `checked` and withdrawal of its `finding` attribution. The original reader retains the `pass/not_pass` logic, with only the new entry receiving precise scope clarification. Existing `verifyPeerAdapterDirectories`/`verifyHostPeers`, Contracts Schema, Harness algorithms, and four top-level commands remain unchanged. Only joint consistency is assessed; no guarantee is made that every pairwise or internal sub-comparison was executed."
    changes:
      changed:
        - "Kit introduces the root-level API `runPeerAdapterCheck({root, request, peerRoots})` in version 0.36.0, reusing existing peer requests and actual directory verification without a new CLI. The API fixes the first peer as the anchor and performs N−1 real two-peer calls on the remaining peers, binding before/after filesystem observations and returning the existing `professional-conclusion`. Full health is `complete/ENGINEERING_CLEAR`, an attributable `closure-conflict` from the same actual call is classified as `finding`, mixed unmet conditions as `partial`, and no valid completed pair as `not-performed`, even when failed calls were attempted. Invalid global parameters raise SFC2003, unknown exceptions are thrown directly, and drift causing a pair to become invalid results in its removal from `checked` and withdrawal of its `finding` attribution. The original reader retains the `pass/not_pass` logic, with only the new entry receiving precise scope clarification. Existing `verifyPeerAdapterDirectories`/`verifyHostPeers`, Contracts Schema, Harness algorithms, and four top-level commands remain unchanged. Only joint consistency is assessed; no guarantee is made that every pairwise or internal sub-comparison was executed."
    upgradeNotes: "Adopt all four units at 0.36.0; existing callers need no forced migration. Source candidates, local testing, or static exits cannot validate formal channels, installation, loading, or business readiness. The formal 0.35.0 package does not contain the new API."
  zh-CN:
    summary: "Kit新增包根接口`runPeerAdapterCheck({root, request, peerRoots})`，在0.36.0中复用既有peer请求与实际目录核验，无新CLI。该接口固定首个peer为锚，对剩余N−1个peer执行真实二peer调用，前后观察衔接并返回既有`professional-conclusion`。完整健康状态为`complete/ENGINEERING_CLEAR`，真实同次`closure-conflict`归为`finding`，混合不足为`partial`，无有效已完成项为`not-performed`。无效全局参数抛出SFC2003，未知异常直接抛出，漂移导致关联pair失效时，从`checked`移除并撤销其`finding`归因。原读取器保留`pass/not_pass`算法，仅对新入口提供准确范围说明。旧有`verifyPeerAdapterDirectories`/`verifyHostPeers`、Contracts Schema、Harness算法及四顶层命令保持不变。仅判断联合一致性，不保证每对或每个内部子比较均运行。"
    changes:
      changed:
        - "Kit新增包根接口`runPeerAdapterCheck({root, request, peerRoots})`，在0.36.0中复用既有peer请求与实际目录核验，无新CLI。该接口固定首个peer为锚，对剩余N−1个peer执行真实二peer调用，前后观察衔接并返回既有`professional-conclusion`。完整健康状态为`complete/ENGINEERING_CLEAR`，真实同次`closure-conflict`归为`finding`，混合不足为`partial`，无有效已完成项为`not-performed`。无效全局参数抛出SFC2003，未知异常直接抛出，漂移导致关联pair失效时，从`checked`移除并撤销其`finding`归因。原读取器保留`pass/not_pass`算法，仅对新入口提供准确范围说明。旧有`verifyPeerAdapterDirectories`/`verifyHostPeers`、Contracts Schema、Harness算法及四顶层命令保持不变。仅判断联合一致性，不保证每对或每个内部子比较均运行。"
    upgradeNotes: "四单元需锁步采用0.36.0，旧调用不强制迁移。源候选、本地测试、静态退出均不能证明正式渠道、安装加载或业务可用性。正式0.35.0不包含新入口。"
