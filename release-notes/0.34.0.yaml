version: 0.34.0
date: 2026-11-02
locales:
  en:
    summary: "Engineering Kit 0.34.0 includes runBranchFieldCheck / check branch-fields for selected ESM if-condition fields and direct Schema properties and enum/const values, plus runPublicSurfaceBindingCheck / check public-surface-bindings for six direct declarations across a selected Skill identity, a complete Python route dictionary, a Method JSON document and four schemas. Neither entry executes targets. Unsupported inputs remain insufficient; supported contradictory values are findings. Public-surface binding drift revokes all comparisons in dependent bindings while independent stable facts remain. Findings and completion are independent; partial is not complete clear. Caller-owned business conditions, schema authority, selection completeness, runtime semantics and full METHOD003 remain outside the mechanical result."
    changes:
      changed:
        - "Engineering Kit 0.34.0 includes runBranchFieldCheck / check branch-fields for selected ESM if-condition fields and direct Schema properties and enum/const values, plus runPublicSurfaceBindingCheck / check public-surface-bindings for six direct declarations across a selected Skill identity, a complete Python route dictionary, a Method JSON document and four schemas."
    upgradeNotes: "Use Engineering Kit and foundation-adoption-review 0.34.0 for the new scopes. Existing entrypoints remain compatible, with no mandatory migration for old consumers. Contracts and Harness have no new mechanism behavior and move only in lockstep version and necessary derivations. Version 0.33.0 remains an unpublished source candidate; 0.34.0 combines both capabilities. Local candidates do not establish remote publication or authorization; the four units require formal verification before overall publication is claimed."
  zh-CN:
    summary: "本版 Engineering Kit 新增两项独立检查入口：`runBranchFieldCheck` 与 `check branch-fields`，以及 `runPublicSurfaceBindingCheck` 与 `check public-surface-bindings`。前者聚焦于指定ESM if分支的直接字段与字符串字面量，核对是否与Schema中定义的 `properties`、`enum`、`const` 保持一致，仅执行静态边界比对，不解析 `$ref`、不执行目标、不判断值域完整性或业务逻辑成功性。无 `enum`/`const` 时仅作字段定位。既有封闭同级条件必填的排除边界维持不变。\n\n后者则读取调用方选定的Skill身份、完整Python路由根字典、共同Method JSON，以及 `task`/`result`/`parameters`/`domainResult` 四个Schema，对六组直接声明进行一致性比对。所有必需材料与支持前提完整时，任意一组值不等即产生 `findings`；若材料缺失、存在歧义、不支持或发生漂移，则判定为 `insufficient`。整绑定依赖失效时，仅保留不受影响的独立绑定事实。`findings` 与 `completion` 状态独立，存在发现即不构成“完整通过”，`partial` 状态不可视为 `complete` 或 `ENGINEERING_CLEAR`。"
    changes:
      changed:
        - "本版 Engineering Kit 新增两项独立检查入口：`runBranchFieldCheck` 与 `check branch-fields`，以及 `runPublicSurfaceBindingCheck` 与 `check public-surface-bindings`。"
    upgradeNotes: "Contracts与Harness在本版无新增机制行为，仅进行锁步版本同步与必要派生，既有协议与算法保持不变。升级需同时满足Kit与Plugin均升级至0.34.0版本。旧有入口保持兼容，不强制旧消费者迁移。\n\n0.33.0版本仅为未发布源码候选，不具备正式发布效力；0.34.0为首次合并交付，统一包含两项公共能力。本地候选状态不构成远端发布或授权证明，四单元正式验证通过后，方可认定整体发布。"
